name: Build RECALL APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Move source files into standard Android layout
        run: |
          mkdir -p app/src/main/java/com/recall/app
          mkdir -p app/src/main/res/values
          [ -f AndroidManifest.xml ] && mv AndroidManifest.xml app/src/main/AndroidManifest.xml || true
          [ -f MainActivity.kt ] && mv MainActivity.kt app/src/main/java/com/recall/app/MainActivity.kt || true
          [ -f AudioCaptureService.kt ] && mv AudioCaptureService.kt app/src/main/java/com/recall/app/AudioCaptureService.kt || true
          [ -f styles.xml ] && mv styles.xml app/src/main/res/values/styles.xml || true
          rm -f build.gradle.kts

      - name: Write project-level build.gradle.kts
        run: |
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.9.1" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

      - name: Write app/build.gradle.kts
        run: |
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.recall.app"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.recall.app"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "0.1.0"
              }

              buildTypes {
                  debug { isMinifyEnabled = false }
                  release { isMinifyEnabled = false }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.11.1

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RECALL-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
